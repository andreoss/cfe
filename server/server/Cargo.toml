[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
domain = { path = "../domain" }
app = { path = "../app" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "uuid"] }
uuid = { version = "1", features = ["v4"] }
argon2 = "0.5"
rand = "0.8"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
